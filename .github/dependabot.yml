version: 2

updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # RUSTSEC-2024-0429 (GHSA-wrw7-89jp-8q8g): unsoundness in glib::VariantStrIter,
      # fixed only in glib >= 0.20.0. glib is a Linux-only transitive dependency pinned
      # to ^0.18 by the EOL gtk 0.18 bindings used by webkit2gtk/wry/tao. There is no
      # compatible release available; resolution requires the Tauri v3 / GTK4 migration.
      - dependency-name: "glib"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
